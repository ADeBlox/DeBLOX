<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeBLOX - Classic</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace, Tahoma, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            border-top: 5px solid #000000;
        }

        /* شريط التنقل الكلاسيكي البسيط */
        nav {
            background-color: #000000;
            color: #ffffff;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #ffffff;
            padding: 5px 10px;
            transition: all 0.1s;
        }

        .nav-links a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #000000;
            padding-bottom: 5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* شبكة الألعاب البسيطة */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            padding: 15px;
            box-shadow: 4px 4px 0px #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-thumbnail {
            width: 100%;
            height: 120px;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .game-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .game-author {
            font-size: 13px;
            color: #555555;
            margin: 0 0 15px 0;
        }

        .play-btn {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.1s;
        }

        .play-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .no-maps {
            text-align: center;
            color: #555;
            grid-column: 1 / -1;
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل -->
    <nav>
        <a href="#" class="nav-brand">DEBLOX</a>
        <div class="nav-links">
            <a href="#">Games</a>
            <a href="DeBlox.zip" download>Download Client</a>
        </div>
    </nav>

    <div class="container">
        <div class="section-title">Games Archive</div>
        
        <!-- قائمة الألعاب -->
        <div class="games-grid" id="maps-container">
            <p class="no-maps">Loading games...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://twwcjcocozivtpqrkykl.supabase.co";
        const API_KEY = "sb_publishable_QgoJeQTT_vlAMthDuvOC2A_vQoGJxH_";

        function playMap(mapId) {
            window.location.href = `deblox://${mapId}`;
        }

        async function fetchMaps() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/maps?select=id,name,description`, {
                    headers: {
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`
                    }
                });
                const maps = await response.json();
                
                const mapsContainer = document.getElementById("maps-container");
                mapsContainer.innerHTML = "";

                if (!maps || maps.length === 0) {
                    mapsContainer.innerHTML = "<p class='no-maps'>No games found.</p>";
                    return;
                }

                maps.forEach(map => {
                    const card = document.createElement("div");
                    card.className = "game-card";
                    
                    const firstLetter = map.name ? map.name.charAt(0).toUpperCase() : "DB";
                    // حقل description يمثل اسم المطور بناءً على رغبتك
                    const authorName = map.description ? `By ${map.description}` : "By Unknown";

                    card.innerHTML = `
                        <div>
                            <div class="game-thumbnail">${firstLetter}</div>
                            <div class="game-title">${map.name}</div>
                            <div class="game-author">${authorName}</div>
                        </div>
                        <button class="play-btn" onclick="playMap(${map.id})">Play</button>
                    `;
                    mapsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching maps:", error);
                document.getElementById("maps-container").innerHTML = "<p class='no-maps'>Error loading games.</p>";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchMaps();
        });
    </script>
</body>
</html>
