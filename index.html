<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeBlox</title>
    <style>
        :root {
            --primary-color: #0d69ac;
            --secondary-color: #a4bd47;
            --bg-color: #1e1e1e;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-color);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 22px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .map-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .map-card:hover {
            transform: translateY(-5px);
        }
        .map-info {
            padding: 20px;
        }
        .map-info h3 {
            margin-top: 0;
            color: var(--secondary-color);
        }
        .btn {
            display: inline-block;
            background-color: var(--secondary-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .players-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #444;
        }
        th {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to DeBLOX!</h1>
    </header>

    <div class="container">
        <h2 class="section-title">Games</h2>
        <div class="maps-grid" id="maps-container">
			
		</div>

        
    </div>

    <script>
        const SUPABASE_URL = "https://fyaenayirqkyqmsvqwvu.supabase.co";
        const API_KEY = "sb_publishable_6TPxZAyr9udsr6WyiOohlQ_PIferL2Z";

        function playMap(mapId) {
            let username = prompt("Add your username:", "Player" + Math.floor(Math.random() * 100));
            if (!username) return;
            // يفتح البروتوكول ويرسل رقم الماب مع اسم المستخدم
            window.location.href = `deblox://${mapId}/${username}`;
        }

        async function fetchMaps() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/maps?select=id,name,description`, {
                    headers: {
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`
                    }
                });
                const maps = await response.json();
                
                const mapsContainer = document.getElementById("maps-container");
                mapsContainer.innerHTML = "";

                if (!maps || maps.length === 0) {
                    mapsContainer.innerHTML = "<p style='color: white;'>No maps.</p>";
                    return;
                }

                maps.forEach(map => {
                    const card = document.createElement("div");
                    card.className = "map-card";
                    card.innerHTML = `
                        <div class="map-info">
                            <h3>${map.name}</h3>
                            <p>${map.description || "Without discription."}</p>
                            <button class="btn" onclick="playMap(${map.id})">Join</button>
                        </div>
                    `;
                    mapsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error to get maps:", error);
            }
        }

        // استدعِ الدالة عند تحميل الصفحة للتأكد من جاهزية العناصر
        document.addEventListener("DOMContentLoaded", () => {
            fetchMaps();
        });
    </script>
</body>
</html>
